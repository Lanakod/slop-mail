name: Desktop mail client
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-aarch64
            artifact: macOS-arm64
            path: target/release/bundle/dmg/*.dmg
          - os: windows-2022
            platform: windows-x86_64
            artifact: Windows-x64
            path: target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:ui
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - if: runner.os == 'macOS'
        run: sh scripts/package-macos.sh
      - if: runner.os == 'Windows'
        run: npm run build -- --ci --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: Slop-Mail-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/v')
        name: Prepare signed update assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python scripts/release-assets.py ${{ matrix.platform }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: update-${{ matrix.platform }}
          path: target/release-assets/*
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: update-*
          merge-multiple: true
          path: target/release-assets
      - run: python scripts/release-assets.py manifest --tag "$GITHUB_REF_NAME"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/release-assets/* --verify-tag --generate-notes
