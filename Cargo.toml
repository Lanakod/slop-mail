[package]
name = "slop-mail"
version = "0.3.0"
edition = "2021"
description = "Local-first desktop email client"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rfd = "0.15"
imap = "2.4"
native-tls = "0.2"
lettre = { version = "0.11", features = ["smtp-transport", "builder", "native-tls"] }
mailparse = "0.16"
base64 = "0.22"
open = "5"
ammonia = "4"
html2text = "0.16"
directories = "6"

tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
roxmltree = "0.20"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }
